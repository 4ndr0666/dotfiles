# playlist-exts=cue,edl,m3u,m3u8,pls
# directory-mode=ignore                   # <default auto|recursive|lazy|ignore>
# directory-filter-types=video          # <video,audio,image>
# autocreate-playlist=same              # <no|filter|same>
# ordered-chapters=no
metadata-codepage=auto
msg-level=all=info,auto_profiles=warn
msg-color=yes
