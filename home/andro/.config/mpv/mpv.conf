## Description: This is the config file for the MPV
# player customized with the complete gamut of settings.
#

# === [ VIDEO / GPU CORE ] === #
vo=gpu
gpu-api=opengl         # AVAILABLE: opengl/vulkan/d3d11
gpu-context=wayland
hwdec=auto-copy-safe
#auto-copy        # AVAILABLE: safe
hwdec-codecs=-cuda
input-ipc-server=/tmp/mpvsocket
# vd-lavc-dr=yes
# vd-lavc-assume-old-x264=yes
# opengl-pbo=yes
# vd=h264_qsv,hevc_qsv,mpeg2_qsv,vp9_qsv,vp8_qsv,av1_qsv
# vulkan-device="NVIDIA GeForce RTX 2070 Super"
opengl-early-flush=yes
x11-bypass-compositor=yes
#fs-only
hr-seek=absolute
#yes
hr-seek-framedrop=no
framedrop=no
#vo




# === [ PLAYBACK LOGIC ] === #
#loop-file=inf
# speed=0.50
# play-direction=-
# stop-playback-on-init-failure=yes
no-resume-playback
save-position-on-quit=yes              # Use shortcut key to save to watch later when exiting, if the whitelist is not used, the filter list, volume, rate and other states will also be saved and displayed next.
autocreate-playlist=filter
directory-filter-types=.mp4,.mkv,.gif,.m4v,.wmv,.mpg,.avi,.webm,.mov,.3gp,.mpeg,.ts
watch-history-path="~~cache/watch_history.jsonl"         # The path to store the viewing history. Default value: ~~state/watch_history.jsonl
# reset-on-next-file-clr=audio-delay,mute,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume
# slang=en,eng,enUS,en-US
# sub-auto=fuzzy
write-filename-in-watch-later-config=yes
# ignore-path-in-watch-later-config
resume-playback-check-mtime=yes
# watch-later-options-remove=sub-pos
# watch-later-options-remove=osd-margin-y
watch-later-dir="~~/watch_later/"
watch-later-options=start,vid,aid,sid
# watch-later-options-clr              # You cannot restore all settings during playback, this can solve some known problems.
# watch-later-options-remove=contrast  # Cannot be specified like --watch-later-options=option1,option2; use the watch-later-options whitelist to set it.
save-watch-history=yes                 # <yes|default no>
reset-on-next-file=vid,aid,sid,secondary-sid,vf,af,loop-file,deinterlace,contrast,brightness,gamma,saturation,hue,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,speed,audio-delay,sub-pos,sub-scale,sub-delay,sub-speed,sub-visibility,secondary-sub-visibility

