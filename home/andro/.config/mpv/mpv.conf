# === [ Builtin Profiles & Shader Configs ] === #
#
# can also be placed separately in "~~/profiles.conf"
#
# profile=ICC
# profile=ICC+
# profile=Target                              # cannot coexist with icc color management
# profile=Dither                              # energy consumption is low
# profile=Dither+                           # best effect and the most energy-consuming
# profile=Tscale                              # [Must comment before enabling --tscale=<value>] Interpolation algorithm.
# profile=Tscale+                           # [Must comment before enabling --tscale=<value>] interpolation algorithm.
# profile=HQ                                  # The most commonly used built-in algorithm configuration group
# profile=DeBand-low                          # [Need to comment before enabling --deband] When using low, good results have been achieved.
# profile=DeBand-medium                     # [Need to comment before enabling --deband] The deband close to madvr is set to medium.
# profile=DeBand-high                       # [Need to comment before enabling --deband] The deband close to madvr is set to high.
# profile=SDR2HDR                           # valid on hdr devices, not recommended to be enabled. Only available with --vo=gpu-next
# profile=HDR2SDR                             # HDR mapping parameter configuration group
# profile=HDR-PASS                          # --icc-profile, icc-profile-auto and --target-trc parameters need to be disabled for HDR passthrough.
# profile=SWscaler                          # Alternative software scaling solution
# profile=NNEDI3                              # suppresses aliasing and ringing artifacts
# profile=NNEDI3+                           # use it depending on the performance of the device.
# profile=ravu-zoom                         # zoom in to target resolution
# profile=FSRCNNX                           # produces more ringing artifacts and performs worse in low-resolution images
# profile=FSRCNNX+                          # Excellent anti-ringing artifacts for low-resolution images
# profile=Ani4K                             # performance overhead is huge, so please use it as much as you can
# profile=AniSD                             # performance overhead is huge, so please use it as much as you can
# profile=Anime4K                           # aliasing ringing well, and there is still obvious perceptual smear deterioration
# profile=SSIM                              # Suitable for low performance consumption

[ICC]
 icc-profile=""
 icc-profile-auto
 icc-intent=0
 icc-force-contrast=1000
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[ICC+]
 icc-profile="~~/icc/ITU-RBT709ReferenceDisplay.icc"
 icc-intent=0
 icc-force-contrast=no
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[Target]
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 target-trc=gamma2.2
 target-peak=auto
 target-contrast=auto
# sdr-adjust-gamma=no
# treat-srgb-as-power22=no

[Dither]
 dither-depth=auto
 dither=fruit
 dither-size-fruit=6

[Dither+]
 dither-depth=auto
 dither=error-diffusion
 error-diffusion=floyd-steinberg

[Tscale]
 video-sync=display-resample
# video-sync-max-video-change=5
 interpolation
# interpolation-preserve=no
 tscale=oversample

[Tscale+]
 video-sync=display-resample
# video-sync-max-video-change=5
 interpolation
# interpolation-preserve=no
 tscale=sphinx
 tscale-blur=0.65

[HQ]
 scale=ewa_hanning
 cscale=bilinear
 dscale=catmull_rom
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=no
# scaler-resizes-only=no
 deband=no

[DeBand-low]
 profile-desc=DeBand low
 deband-iterations=1
 deband-threshold=48
 deband-range=16
 deband-grain=16

[DeBand-medium]
 profile-desc=deband medium
 deband-iterations=2
 deband-threshold=64
 deband-range=16
 deband-grain=24

[DeBand-high]
 profile-desc=deband high
 deband-iterations=3
 deband-threshold=64
 deband-range=16
 deband-grain=24

[HDR2SDR]
 profile-desc=HDR-SDR 映射参数
 tone-mapping=auto
# tone-mapping-param=1.0
# tone-mapping-max-boost=1.0
 gamut-mapping-mode=auto
 hdr-contrast-recovery=0.30
# hdr-contrast-smoothness=3.5
 hdr-compute-peak=auto
 hdr-peak-percentile=99.995
 hdr-peak-decay-rate=20
 hdr-scene-threshold-low=1.0
 hdr-scene-threshold-high=3.0
 allow-delayed-peak-detect=no

[SDR2HDR]
 profile-desc=SDR 反向映射 HDR 参数
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
# target-gamut=dci-p3
 target-trc=auto
 target-peak=auto
 target-colorspace-hint=auto
 inverse-tone-mapping=yes

[SWscaler]
 profile-desc=Software scaling configuration
 sws-allow-zimg=no                  # Prefer zimg (usually higher quality) over libswscale, default yes. ffmpeg often has compatibility issues with zimg, it is recommended to disable it
 sws-scaler=bicublin                # [libswscale] <fast-bilinear|bilinear|bicubic default|x|point|area|bicublin|gauss|sinc|lanczos|spline>
                                    # [libswscale] Scaling algorithm (also acts on the chroma plane)
# sws-fast=yes                     # [libswscale] Optimize performance at the expense of quality, default no
