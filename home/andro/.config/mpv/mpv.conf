# === [ IMAGING & SCREENSHOTS ] ===#
# vo-image-format=jpeg
# vo-image-webp-lossless=yes
# vo-image-webp-quality=90
# vo-image-outdir=~/Pictures/caps
screenshot-dir="/home/andro/Pictures/screenshots"
screenshot-template="%{media-title}-%P-%n"
# ALT TEMPLATE: "%F - [%P]v%#01n"
screenshot-format=jpg                        # <default jpg|(same as above)jpeg|png|webp|jxl|avif>
# screenshot-png-compression=7               # <0-9> PNG compression level, too high a level will affect performance, the default is 7
# screenshot-png-filter=5                    # Set the filter to apply before PNG compression. 0 is None, 1 is sub, 2 is up, 3 is average, 4 is Paeth, 5 is mixed, which affects the level of compression that can be achieved. Mixed achieves the best compression for most images, so it is the default setting.
screenshot-jpeg-quality=100                  # <0-100> Highest quality for JPEG, default is 90
screenshot-jpeg-source-chroma=no             # Write JPEG with the same chroma half-sampling as the source video, default yes
# screenshot-webp-lossless=yes               # Lossless WEBP, default no
# screenshot-webp-quality=85                 # <0-100> [Effective when --screenshot-webp-lossless=no] Loss the quality of WEBP, default 75
# screenshot-webp-compression=6              # <0-6> WEBP compression level. Too high a level will affect performance. The default is 4. NOTE: This will also affect image quality when using lossy WEBP
# screenshot-jxl-distance=0                  # <0-15> JXL's visual model distance, 0 means quality lossless, 0.1 means visual lossless, the default 1 is equivalent to JPEG's 90 quality
# screenshot-jxl-effort=5                    # <1-9> JXL compression level, too high level affects performance, default 4
screenshot-tag-colorspace=no                 # Label screenshots with appropriate color space (not all formats are supported). Default yes
# screenshot-high-bit-depth=no               # Mainly affects PNG and JPEG XL, use the same bit depth as the video output, the default is yes. NOTE: Using same bit depth will significantly increase the final size of the png/jxl
# screenshot-sw=yes                          # Default: no. If yes, software scaler used to convert the video to RGB. Software renderers may lack some features, such as HDR rendering




# ===[ Extensions ]=== #
[extension.gif]
loop-file=no
cache=no

[extension.webm]
loop-file=no
swapchain-depth=3
demuxer-max-bytes=789MiB



# ===[ PROFILES ]=== #
[playdir]
profile-desc="playdir.sh profile"
loop-playlist=inf
shuffle=yes

[reverse]
profile-desc="Reverse playback"
play-direction=-
loop-playlist=force
loop-file=no
shuffle=no

[slomo]
profile-desc="60FPS Interpolated Slow Motion"
display-fps-override=60
linear-downscaling=no
tscale=oversample
zimg-dither=error-diffusion
video-sync=display-resample
interpolation=yes
interpolation-preserve=yes

[svp]
profile-desc="Bunkr.cr network headers for SVP"
# Native HTTP/HTTPS Header Injection (For direct .mp4 / .m3u8 playback)
referrer="https://bunkr.cr/"
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
# Explicitly force HTTP fields to spoof origin
#http-header-fields="Referer: https://bunkr.cr/","Origin: https://bunkr.cr/"
cache=yes
cache-on-disk=yes
cache-pause=no
cache-pause-initial=yes
cache-pause-wait=10
cache-secs=30
demuxer-max-bytes=1000MiB
demuxer-max-back-bytes=512MiB
demuxer-readahead-secs=30
hls-bitrate=max
#stream-buffer-size=5MiB
hwdec=auto-copy-safe
hr-seek=always
hr-seek-framedrop=no
no-resume-playback
ignore-path-in-watch-later-config=yes

[local-network-bypass]
profile-desc=Bypass yt-dlp parsing for local Python server streams
profile-cond=path:find("192.168.1.219") ~= nil or path:find("127.0.0.1") ~= nil
profile-restore=copy
ytdl=no

[network]
profile-desc="System network Settings"
user-agent="Mozilla/5.0 (X11; Linux x86_64; rv:121.0) Gecko/20100101 Firefox/121.0"
cache=yes
cache-on-disk=yes
cache-pause=yes
cache-pause-wait=10
cache-secs=60
cache-pause-initial=yes
demuxer-max-back-bytes=512MiB
demuxer-readahead-secs=30
profile=fast
hls-bitrate=max
ontop=yes
border=no
window-scale=0.7
keep-open=always
player-operation-mode=pseudo-gui

[play_with_mpv]
profile-desc=Play_with_mpv
ontop=yes
border=no
window-scale=0.4
geometry=100%:100%





